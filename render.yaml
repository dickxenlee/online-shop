# Render blueprint — deploys the Méiyì shop ("New +" > "Blueprint").
#
# The database is NOT created here on purpose: Render's free Postgres is
# deleted after 30 days. Use a free-forever database from neon.com instead
# and paste its connection string as DATABASE_URL (see DEPLOY.md Step 3).
#
# After the first deploy, fix ALLOWED_HOSTS and SITE_URL to your real address.
services:
  - type: web
    name: meiyi
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn meiyi.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: meiyi.onrender.com
      - key: SITE_URL
        value: https://meiyi.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.5"
      # Paste your Neon connection string here in Render > Environment.
      - key: DATABASE_URL
        sync: false
