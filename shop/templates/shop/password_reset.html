{% extends "shop/base.html" %}

{% block title %}Forgot Password · Méiyì{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-20 text-center">
  <h1 class="font-serif text-4xl text-ink mb-3">Forgot Password</h1>
  <p class="text-ink/60 text-sm mb-8">Type your account email — we'll send you a link to choose a new password.</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <input type="email" name="email" required autofocus placeholder="you@email.com" class="w-full border border-ink/25 px-4 py-3 focus:border-jade outline-none bg-white">
    <button type="submit" class="w-full bg-jade text-champagne py-4 text-[13px] tracking-wider uppercase hover:bg-jade-light transition-colors">Send Reset Link</button>
  </form>
  <p class="text-sm text-ink/60 mt-6"><a href="{% url 'shop:login' %}" class="underline hover:text-jade">Back to log in</a></p>
</section>
{% endblock %}
