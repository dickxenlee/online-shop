{% extends "shop/base.html" %}

{% block title %}Log In · Méiyì{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-20">
  <p class="text-[11px] tracking-luxe uppercase text-maroon mb-3 text-center">Welcome back</p>
  <h1 class="font-serif text-4xl text-ink mb-8 text-center">Log In</h1>

  {% if form.errors %}
  <p class="text-maroon text-sm mb-5 text-center bg-maroon/5 border border-maroon/20 rounded-sm px-4 py-3">Email or password is not right — please try again.</p>
  {% endif %}

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next|default:'' }}">
    <div>
      <label class="block text-[12px] tracking-wider uppercase text-ink/60 mb-1">Email</label>
      <input type="email" name="username" value="{{ form.username.value|default:'' }}" required autofocus class="w-full border border-ink/25 px-4 py-3 focus:border-jade outline-none bg-white">
    </div>
    <div>
      <label class="block text-[12px] tracking-wider uppercase text-ink/60 mb-1">Password</label>
      <input type="password" name="password" required class="w-full border border-ink/25 px-4 py-3 focus:border-jade outline-none bg-white">
    </div>
    <button type="submit" class="w-full bg-jade text-champagne py-4 text-[13px] tracking-wider uppercase hover:bg-jade-light transition-colors">Log In</button>
  </form>

  <div class="text-center text-sm text-ink/60 mt-6 space-y-2">
    <p>New to Méiyì? <a href="{% url 'shop:register' %}" class="text-jade underline">Create an account</a></p>
    <p><a href="{% url 'shop:password_reset' %}" class="underline hover:text-jade">Forgot your password?</a></p>
  </div>
</section>
{% endblock %}
