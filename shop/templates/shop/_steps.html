{% comment %}Checkout progress bar. Pass active=0 (Bag), 1 (Details), or 2 (Confirmed).{% endcomment %}
<div class="max-w-3xl mx-auto px-6 lg:px-10 pt-10">
  <div class="flex items-center gap-3 text-[11px] tracking-luxe uppercase select-none">
    <div class="flex items-center gap-2 {% if active >= 0 %}text-jade{% else %}text-ink/35{% endif %}">
      <span class="w-6 h-6 rounded-full grid place-items-center text-[11px] {% if active >= 0 %}bg-jade text-champagne{% else %}border border-ink/25{% endif %}">1</span>
      <span class="hidden sm:inline">Bag</span>
    </div>
    <span class="flex-1 h-px {% if active >= 1 %}bg-jade{% else %}bg-champagne-deep{% endif %}"></span>
    <div class="flex items-center gap-2 {% if active >= 1 %}text-jade{% else %}text-ink/35{% endif %}">
      <span class="w-6 h-6 rounded-full grid place-items-center text-[11px] {% if active >= 1 %}bg-jade text-champagne{% else %}border border-ink/25{% endif %}">2</span>
      <span class="hidden sm:inline">Details</span>
    </div>
    <span class="flex-1 h-px {% if active >= 2 %}bg-jade{% else %}bg-champagne-deep{% endif %}"></span>
    <div class="flex items-center gap-2 {% if active >= 2 %}text-jade{% else %}text-ink/35{% endif %}">
      <span class="w-6 h-6 rounded-full grid place-items-center text-[11px] {% if active >= 2 %}bg-jade text-champagne{% else %}border border-ink/25{% endif %}">3</span>
      <span class="hidden sm:inline">Confirmed</span>
    </div>
  </div>
</div>
