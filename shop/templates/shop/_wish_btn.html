{% comment %}Wishlist heart for a product card. Use: include with p=product.{% endcomment %}
<form method="post" action="{% url 'shop:wishlist_toggle' p.id %}" class="wish-toggle absolute bottom-4 right-4">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.path }}">
  <button type="submit" aria-label="Save {{ p.name }} to wishlist"
          class="w-9 h-9 grid place-items-center rounded-full bg-white/85 text-jade hover:bg-white shadow-sm transition-colors">
    <svg class="wish-heart" width="17" height="17" viewBox="0 0 24 24" fill="{% if p.id in wishlist_ids %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.8"><path d="M12 21C7 16.5 3 13 3 8.8 3 6 5.2 4 7.8 4c1.7 0 3.2.9 4.2 2.3C13 4.9 14.5 4 16.2 4 18.8 4 21 6 21 8.8c0 4.2-4 7.7-9 12.2Z"/></svg>
  </button>
</form>
